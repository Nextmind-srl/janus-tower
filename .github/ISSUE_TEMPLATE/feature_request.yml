name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        JanusTower is a local, single-user, **read-only** tool for Google Cloud. Requests that need write
        access to Google Cloud, or that send personal data to external services, will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: readonly
    attributes:
      label: Scope check
      options:
        - label: The feature only uses read-only Google Cloud calls.
          required: true
