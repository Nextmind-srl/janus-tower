name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not paste secrets, OAuth tokens, project IDs, user emails or
        any other real data** from your Google Cloud estate. Redact or replace them with placeholders.
        For security problems do not open an issue: see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in ...
        2. Open the view ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JanusTower version or commit
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run it?
      options:
        - Python (local)
        - Docker
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (if run locally)
      placeholder: "3.12"
  - type: input
    id: os
    attributes:
      label: Operating system and browser
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (redacted)
      render: text
